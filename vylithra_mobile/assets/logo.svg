<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Cyan to Teal Gradient -->
    <linearGradient id="vylithra-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>

    <!-- Deep Purple/Indigo Gradient -->
    <linearGradient id="vylithra-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>

    <!-- Mid-tone Blend Gradient -->
    <linearGradient id="vylithra-blend" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base (Transparent for versatility, but we add a subtle glow) -->
  <circle cx="256" cy="256" r="240" fill="url(#vylithra-purple)" opacity="0.05" />

  <!-- The "V" Construct (Isometric/Intersecting Polygons) -->
  <g transform="translate(10, -20)" filter="url(#shadow)">
    <!-- Left Wing (Cyan) -->
    <path d="M 120 180 L 190 180 L 256 360 L 186 360 Z" fill="url(#vylithra-cyan)" />
    
    <!-- Right Wing (Purple) crossing BEHIND left wing at the bottom -->
    <path d="M 392 180 L 322 180 L 256 360 L 326 360 Z" fill="url(#vylithra-purple)" />
    
    <!-- Intersecting Facet / Forward Fold (Creates the 3D Illusion) -->
    <path d="M 190 180 L 256 260 L 322 180 L 256 220 Z" fill="url(#vylithra-blend)" />
    
    <!-- Top Floating Diamond (The "Spark" or "Canvas") -->
    <polygon points="256,90 290,124 256,158 222,124" fill="url(#vylithra-cyan)" />
  </g>
</svg>
