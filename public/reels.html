<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Immersive App Color -->
    <meta name="theme-color" content="#000000">
    <!-- Aggressive Cache Busting for UX Synchronization -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Cinematic Feed | Vylithra Reels</title>
    <meta name="description" content="Experience immersive, short-form visual content from top creators on Vylithra Reels.">
    <meta name="keywords" content="Vylithra reels, cinematic feed, short-form content, visual creators">
    <script src="/theme-loader.js"></script>
    
    <link rel="stylesheet" href="/ui-common.css">
    <script src="/ui-common.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Cinematic Layout Force Dark Mode */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden; /* Prevent body scroll, handle scroll in container */
            font-family: 'Outfit', sans-serif;
        }

        /* Override Global Navs for Full Page Option 3 Immersion */
        .layout-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .layout-content {
            padding: 0 !important;
            flex: 1;
            height: 100vh;
            position: relative;
            background: #000;
        }

        /* Videlo Exact Top Navigation */
        .videlo-top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            background: transparent;
            pointer-events: auto;
        }
        
        .videlo-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }
        
        .videlo-nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }
        
        .videlo-nav-links a {
            text-decoration: none;
            color: rgba(255,255,255,0.5);
            font-weight: 600;
            font-size: 1.05rem;
            transition: color 0.2s;
        }
        .videlo-nav-links a.active, .videlo-nav-links a:hover {
            color: #fff;
        }

        .videlo-nav-icons {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        .videlo-nav-icons i {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: color 0.2s;
        }
        .videlo-nav-icons i:hover { color: #fff; }

        .v-nav-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .videlo-top-nav { display: none; } /* Mobile uses app-like bottom nav mostly */
        }

        @media (min-width: 768px) {
            .layout-sidebar, .top-nav, #globalAmbientGlow {
                display: none !important; /* Force pure black Option 3 layout */
            }
        }

        /* Elegant Back Button for Obsidian Mode */
        .obsidian-back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 9999;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: none; /* Desktop only */
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        @media (min-width: 768px) {
            .obsidian-back-btn { display: flex; }
        }
        .obsidian-back-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); }
        .obsidian-back-btn i { font-size: 1.2rem; }

        .top-nav {
            background: transparent !important;
            border: none !important;
            backdrop-filter: none !important;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        /* Snap Scrolling Magic */
        #reels-feed {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            /* Hide Scrollbar */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #reels-feed::-webkit-scrollbar {
            display: none;
        }

        /* Reel Container */
        .reel-container {
            height: 100vh;
            width: 100%;
            scroll-snap-align: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .reel-video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Don't crop, show full video */
            background: #111;
        }

        /* Mobile Base Overlay Framework */
        .reel-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            padding-bottom: 80px; /* Space for Bottom Nav */
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 30%, transparent 80%);
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        /* --- VIDELO 1:1 CLONE ARCHITECTURE --- */
        
        @media (min-width: 768px) {
            .reel-container { 
                justify-content: center;
                align-items: center;
                padding: 40px 0;
                height: 100vh;
            }
            .reel-video {
                width: 100%;
                max-width: 400px; /* Precise phone width */
                height: calc(100vh - 120px) !important; /* Proper phone height */
                max-height: 850px;
                border-radius: 40px !important; /* Hardware Bezels */
                border: 6px solid #1c1c1e !important; /* Thick phone bezel */
                object-fit: cover;
                /* The Deep Glowing Aura from the reference image */
                box-shadow: 0 0 140px 40px rgba(50, 70, 180, 0.4), inset 0 0 20px rgba(0,0,0,0.5);
                z-index: 5;
                position: relative;
            }
            .videlo-layout {
                width: 100% !important;
                max-width: 400px !important;
                height: calc(100vh - 120px) !important;
                max-height: 850px !important;
                top: 50% !important;
                bottom: auto !important;
                left: 50% !important;
                right: auto !important;
                transform: translate(-50%, -50%) !important;
                border-radius: 40px !important;
                padding-bottom: 25px !important;
                background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 30%, rgba(0,0,0,0) 60%), linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 20%) !important;
                pointer-events: none;
            }
        }

        .videlo-layout {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            padding: 20px;
            pointer-events: none;
        }

        .videlo-top-title {
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            margin-top: 30px;
        }

        .videlo-bottom-block {
            display: flex;
            flex-direction: column;
            width: 100%;
            pointer-events: auto;
        }

        /* TikTok/Insta Reels Scrubber Style */
        .videlo-scrubber-row {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            display: flex;
            align-items: flex-end;
            padding: 0;
            margin: 0;
            z-index: 100;
        }

        .vid-time {
            display: none !important;
        }

        .videlo-scrubber-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            position: relative;
            transition: height 0.2s ease;
        }
        
        .videlo-scrubber-row:hover .videlo-scrubber-track { 
            height: 6px; 
            background: rgba(255, 255, 255, 0.4);
        }

        .videlo-scrubber-fill {
            height: 100%;
            background: #fff;
            border-radius: 0 2px 2px 0;
            width: 0%;
            pointer-events: none;
            position: relative;
        }
        .videlo-scrubber-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0.5);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        .videlo-scrubber-row:hover .videlo-scrubber-fill::after {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        /* Info and Actions Side-by-Side */
        .videlo-info-actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .videlo-info {
            flex: 1;
            padding-right: 20px;
        }

        .videlo-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .videlo-avatar img, .videlo-avatar .c-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.8);
            object-fit: cover;
            cursor: pointer;
        }

        .videlo-author-text {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .videlo-author-text strong {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        .videlo-author-text small {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
        }

        .videlo-caption {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .videlo-audio {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .videlo-actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .v-btn {
            background: rgba(255, 255, 255, 0.15); /* Videlo frosted aesthetic */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        .v-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.25); }
        .v-btn i { font-size: 1.25rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        
        .v-label {
            position: absolute;
            bottom: -18px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .v-btn i.fa-heart.liked { color: #ff2a5f; }

        /* Loader */
        .reels-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--primary);
            font-size: 2rem;
            width: 100%;
        }

        /* Bottom Nav Override for Dark Mode */
        /* Reels Studio Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #111;
            width: 90%;
            max-width: 450px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: 0.2s;
        }

        .modal-close:hover { background: rgba(255,255,255,0.2); }

        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-family: inherit;
            margin-top: 8px;
            box-sizing: border-box;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .upload-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .upload-btn:hover { filter: brightness(1.1); }
        .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .studio-nav-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .studio-nav-btn:hover { background: var(--primary); border-color: var(--primary); }

        /* Custom Audio Spinning Record Animation */
        .disc-wrapper {
            margin-top: 5px;
            animation: spinDisc 5s linear infinite;
        }
        @keyframes spinDisc { 100% { transform: rotate(360deg); } }

        /* Scrubber Bar Engine */
        .scrubber-track {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 4px;
            background: rgba(255,255,255,0.2);
            z-index: 50; /* Above all overlays */
            cursor: pointer;
            transition: height 0.2s;
        }
        @media (min-width: 768px) {
            .scrubber-track {
                width: 420px; /* Match new video max-width */
                left: 50%;
                transform: translateX(-50%);
                bottom: 40px; /* Ride exactly on the bottom rim of the newly padded floating card */
                border-radius: 0 0 20px 20px; /* Match bottom rim clipping */
                overflow: hidden;
            }
        }
        .scrubber-track:hover { height: 8px; }
        .scrubber-fill {
            height: 100%;
            background: #fff; /* Pure white TikTok style */
            width: 0%;
            border-radius: 0 4px 4px 0;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            position: relative;
        }
        .scrubber-fill::after {
            content: '';
            position: absolute;
            right: -4px; top: 50%;
            transform: translateY(-50%);
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: 0.2s;
        }
        .scrubber-track:hover .scrubber-fill::after { opacity: 1; }

        /* Follow Badge */
        .follow-badge {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            border: 2px solid #000;
            cursor: pointer;
            transition: 0.2s;
        }
        .follow-badge:hover { transform: translateX(-50%) scale(1.1); }
        .follow-badge.following { background: #10b981; display: none; } /* Hide old round badge */
        .ig-follow-btn.following { display: none !important; } /* Hide inline button when followed */

        /* Context Menu Option */
        .context-menu {
            position: absolute;
            bottom: 60px; right: 20px;
            background: rgba(20,20,20,0.95);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 5px;
            z-index: 100;
        }
        .context-menu.active { display: flex; }
        .context-btn {
            background: transparent; border: none; color: white;
            padding: 8px 16px; text-align: left;
            border-radius: 8px; cursor: pointer;
            font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px;
        }
        .context-btn:hover { background: rgba(255,255,255,0.1); }
        .context-btn.danger { color: #ff3b30; }

        /* Comment Modal Slide Up */
        .comment-drawer {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 60vh;
            background: #111;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1);
            display: flex;
            flex-direction: column;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .comment-drawer.active { transform: translateY(0); }
        .cmd-header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; position: relative; }
        .cmd-close { position: absolute; right: 15px; top: 15px; cursor: pointer; color: rgba(255,255,255,0.5); }
        .cmd-body { flex: 1; overflow-y: auto; padding: 15px; }
        .cmd-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
        .cmd-input { flex: 1; background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 15px; border-radius: 20px; outline: none; }
        .cmd-send { background: var(--primary); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        
        .c-item { display: flex; gap: 10px; margin-bottom: 15px; }
        .c-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size: 0.8rem;}
        .c-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit:cover; }
        .c-content { background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 0 15px 15px 15px; font-size: 0.9rem; }
        .c-user { font-weight: 600; font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 4px; }

        @media (min-width: 768px) {
            .comment-drawer {
                width: 400px;
                left: auto;
                right: 20px;
                border-radius: 20px;
                height: 500px;
                bottom: 20px;
                transform: translateX(120%);
                border: 1px solid rgba(255,255,255,0.1);
            }
            .comment-drawer.active { transform: translateX(0); }
        }

        /* Heart Animation */
        .heart-float {
            position: absolute;
            font-size: 5rem;
            color: #ff3b30;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 40;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            15% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            30% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* 2x Fast Forward Overlay */
        .ff-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .ff-overlay.active {
            opacity: 1;
        }

        /* Global Canvas Ambilight */
        .global-ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            filter: blur(80px) saturate(2);
            opacity: 0.8;
            pointer-events: none;
            transition: background 0.5s ease-in-out;
        }

        /* Auto-Scroll Toggle UI */
        .auto-scroll-toggle {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .auto-scroll-toggle.active {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            color: #10b981;
        }

    </style>
</head>

<body>
    <!-- Global Ambient Glow Canvas (Moved out of individual reels) -->
    <canvas id="globalAmbientGlow" class="global-ambient-glow"></canvas>

    <!-- Top Navigation (Transparent) -->
    <nav class="top-nav" style="padding: 15px 20px; display:flex; justify-content:space-between; align-items:center;">
        <a href="/main" class="logo" style="text-decoration:none; color:white; font-size:1.5rem; font-weight:bold; display:flex; align-items:center; gap:10px; text-shadow:0 2px 5px rgba(0,0,0,0.5);">
            <img src="/vylithra_logo.svg" alt="Vylithra Logo" style="width: 32px; height: 32px; vertical-align: middle;">
            Vylithra Reels
        </a>
        <div class="nav-right" style="display:flex; gap:12px; align-items:center;">
            <button id="autoScrollBtn" class="auto-scroll-toggle" onclick="toggleAutoScroll()">
                <i class="fas fa-robot"></i> Auto
            </button>
            <button id="globalMuteToggle" class="action-btn" style="font-size:1.2rem; margin:0; width:40px; height:40px;" onclick="toggleGlobalMute()">
                <i class="fas fa-volume-up"></i>
            </button>
            <button class="studio-nav-btn" onclick="openStudioModal()">
                <i class="fas fa-plus"></i> Create
            </button>
        </div>
    </nav>

    <!-- Upload Reel Modal -->
    <div class="modal-overlay" id="studioModal">
        <div class="modal-content" style="max-width: 500px; padding: 25px; border-radius: 16px; background: #1a1a1e;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom:15px; margin-bottom:20px;">
                <h2 style="margin:0; font-size:1.3rem; font-weight:700;"><i class="fas fa-video" style="color:var(--primary);"></i> Create Reel</h2>
                <i class="fas fa-times" onclick="closeStudioModal()" style="cursor:pointer; font-size:1.2rem; color:rgba(255,255,255,0.6); transition:color 0.2s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='rgba(255,255,255,0.6)'"></i>
            </div>
            
            <form id="reelUploadForm" onsubmit="submitReel(event)">
                <!-- Drag & Drop Zone -->
                <div class="upload-drop-zone" onclick="document.getElementById('reelFile').click()" style="border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; background: rgba(0,0,0,0.2); transition: 0.2s; margin-bottom:20px;" onmouseover="this.style.borderColor='var(--primary)'; this.style.background='rgba(80,100,255,0.05)';" onmouseout="this.style.borderColor='rgba(255,255,255,0.2)'; this.style.background='rgba(0,0,0,0.2)';">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 10px;"></i>
                    <h3 style="margin:0 0 5px 0; font-size:1.1rem; font-weight:600;">Select video to upload</h3>
                    <p style="margin:0; font-size:0.85rem; color:rgba(255,255,255,0.5);">Or drag and drop a file</p>
                    <p style="margin:10px 0 0 0; font-size:0.75rem; color:rgba(255,255,255,0.4);">MP4 or WebM • Up to 10 minutes</p>
                    <input type="file" id="reelFile" accept="video/mp4,video/webm,video/quicktime" required style="display:none;" onchange="const file = this.files[0]; if(file){ document.getElementById('file-name-display').innerText = file.name; const preview = document.getElementById('reelPreview'); preview.style.display = 'block'; preview.src = URL.createObjectURL(file); } else { document.getElementById('reelPreview').style.display = 'none'; }">
                    <video id="reelPreview" style="display:none; width:100%; border-radius:12px; margin-top:10px; max-height:300px; background:#000;" controls></video>
                    <div id="file-name-display" style="margin-top:15px; font-weight:600; color:#10b981; font-size:0.9rem;"></div>
                </div>

                <div class="form-group" style="margin-bottom:20px;">
                    <label style="font-size:0.9rem; font-weight:600; display:flex; justify-content:space-between; margin-bottom:8px;">Caption <span style="font-weight:400; color:rgba(255,255,255,0.4); font-size:0.8rem;">0/2200</span></label>
                    <textarea id="reelCaption" rows="4" placeholder="Write a caption or add hashtags..." required style="width:100%; border-radius:8px; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); padding:12px; color:white; font-family:inherit; resize:vertical; outline:none; transition:0.2s;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'"></textarea>
                </div>

                <!-- Advanced Settings (Visual Presentation) -->
                <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top:20px; margin-bottom:20px;">
                    <p style="margin:0 0 15px 0; font-weight:600; font-size:0.9rem; color:rgba(255,255,255,0.7);">Advanced Settings</p>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <span style="font-size:0.9rem; font-weight:500;">Allow comments</span>
                        <input type="checkbox" checked style="accent-color:var(--primary); transform:scale(1.2); cursor:pointer;">
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <span style="font-size:0.9rem; font-weight:500;">Save video to device</span>
                        <input type="checkbox" style="accent-color:var(--primary); transform:scale(1.2); cursor:pointer;">
                    </div>
                </div>

                <div style="display:flex; gap:10px;">
                    <button type="button" class="upload-btn" style="flex:1; background:rgba(255,255,255,0.1); color:white;" onclick="closeStudioModal()">Discard</button>
                    <button type="submit" class="upload-btn" id="uploadConfigBtn" style="flex:2;">Post Reel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit/Delete Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
            <h2 style="margin-top:0; font-weight:600;"><i class="fas fa-pen" style="color:var(--primary);"></i> Edit Reel</h2>
            <form id="reelEditForm" onsubmit="submitEditReel(event)">
                <input type="hidden" id="editPostId">
                <div class="form-group">
                    <label style="font-size:0.9rem; font-weight:600;">Caption</label>
                    <textarea id="editReelCaption" rows="3" required></textarea>
                </div>
                <button type="submit" class="upload-btn" id="editConfigBtn">Save Changes</button>
            </form>
        </div>
    </div>

    <div class="layout-container">
        <!-- Sidebar will be injected here automatically by ui-common.js -->
        
        <!-- Main Content -->
        <main class="layout-content">
            <!-- Full Videlo Nav Desktop Framework -->
            <div class="videlo-top-nav">
                <div class="obsidian-title" onclick="window.location.href='/main'" style="cursor:pointer; display:flex; align-items:center;">
                    <img src="/vylithra_logo.svg" alt="Vylithra" style="width: 22px; height: 22px; margin-right: 6px;">
                    <span style="font-weight:700; letter-spacing:0.5px;text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">Vylithra Reels</span>
                </div>
                <div class="videlo-nav-links">
                    <a href="/main">For You</a>
                    <a href="/main?tab=following">Following</a>
                    <a href="/reels" class="active">Discover</a>
                    <a href="/profile">Profile</a>
                </div>
                <div class="videlo-nav-icons">
                    <button class="videlo-upload-btn" onclick="openStudioModal()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s;"><i class="fas fa-plus"></i> Upload</button>
                    <i class="fas fa-search" style="cursor:pointer;" onclick="window.location.href='/main'"></i>
                    <i class="fas fa-bell" style="cursor:pointer;" onclick="window.location.href='/main'"></i>
                    <div class="v-nav-avatar" style="cursor:pointer;" onclick="window.location.href='/profile'"><i class="fas fa-user"></i></div>
                </div>
            </div>
            
            <div id="reels-feed">
                <div class="reels-loader">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation will be injected automatically -->

    <!-- Comment Drawer Structure -->
    <div class="comment-drawer" id="commentDrawer">
        <div class="cmd-header">
            Comments
            <i class="fas fa-times cmd-close" onclick="closeCommentDrawer()"></i>
        </div>
        <div class="cmd-body" id="commentFeed">
            <div class="reels-loader" style="font-size:1rem;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        </div>
        <div class="cmd-footer" id="commentFooter">
            <input type="text" class="cmd-input" id="cmdInput" placeholder="Add a comment...">
            <button class="cmd-send" id="cmdSendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- API Logic -->
    <script>
        const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
        let currentUserId = null;
        let posts = [];
        let currentPlayingVideo = null;
        let activeCommentPostId = null;

        // Global Audio Memory
        let isGlobalMuted = localStorage.getItem('vylithra_reels_muted') !== 'false'; // Default true unless explicitly false

        document.addEventListener('DOMContentLoaded', () => {
            currentUserId = parseJwt(localStorage.getItem('token'));
            const feedContainer = document.getElementById('reels-feed');
            
            // Adjust Mute Button UI based on local storage
            const muteBtnI = document.querySelector('#globalMuteToggle i');
            muteBtnI.className = isGlobalMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';

            // Intersection Observer
            const observerOptions = {
                root: feedContainer,
                rootMargin: '0px',
                threshold: 0.6
            };

            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (!video) return;

                    if (entry.isIntersecting) {
                        video.muted = isGlobalMuted; // Enforce global memory natively
                        if (currentPlayingVideo && currentPlayingVideo !== video) {
                            currentPlayingVideo.pause();
                        }
                        video.play().catch(e => console.log('Autoplay blocked gracefully by browser', e));
                        currentPlayingVideo = video;
                    } else {
                        video.pause();
                    }
                });
            }, observerOptions);

            async function loadReels() {
                try {
                    const res = await fetch(`${API_URL}/posts?hasVideo=true`, {
                        headers: { 'x-auth-token': localStorage.getItem('token') || '' }
                    });

                    if (res.ok) {
                        posts = await res.json();
                        renderReels();
                    } else {
                        feedContainer.innerHTML = `<div class="reels-loader" style="color:red; font-size:1rem;">Failed to load Reels.</div>`;
                    }
                } catch (error) {
                    feedContainer.innerHTML = `<div class="reels-loader" style="color:red; font-size:1rem;">Network Error.</div>`;
                }
            }

            function renderReels() {
                feedContainer.innerHTML = '';
                
                if (posts.length === 0) {
                    feedContainer.innerHTML = `
                        <div style="height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center;">
                            <div style="width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; margin-bottom:20px; position:relative;">
                                <i class="fas fa-video" style="font-size:3.5rem; color:var(--primary);"></i>
                                <div style="position:absolute; top:-10px; right:-10px; background:#111; border-radius:50%; padding:5px;"><i class="fas fa-sparkles" style="color:#ffd700;"></i></div>
                            </div>
                            <h2 style="margin:0 0 10px 0; font-weight:700; font-size:1.8rem;">Be the First Creator</h2>
                            <p style="color:rgba(255,255,255,0.6); max-width:300px; line-height:1.5; margin-bottom:30px;">There are no short videos here yet. Upload your first clip and go viral globally!</p>
                            <button class="upload-btn" style="width:200px; border-radius:30px;" onclick="openStudioModal()"><i class="fas fa-plus"></i> Upload Reel</button>
                        </div>
                    `;
                    return;
                }

                posts.forEach((post, index) => {
                    const videoSrc = post.videoUrl || post.attachment;
                    let initial = (post.username || 'U').charAt(0).toUpperCase();
                    let authorAvatarHtml = post.user && post.user.profilePicture 
                        ? `<img src="${(post.user.profilePicture) && String(post.user.profilePicture).startsWith('http') ? (post.user.profilePicture) : '/' + (post.user.profilePicture)}" alt="Avatar">` 
                        : `<div class="c-avatar" style="width:100%; height:100%;">${initial}</div>`;
                    
                    const isLiked = post.likes && currentUserId && post.likes.includes(currentUserId);
                    const likeCount = post.likes ? post.likes.length : 0;
                    const commentCount = post.comments ? post.comments.length : 0;
                    
                    // Is Author check
                    const isAuthor = currentUserId && (post.user === currentUserId || (post.user && post.user._id === currentUserId));

                    const reelHtml = `
                        <div class="reel-container" data-id="${post._id}">
                            <video 
                                class="reel-video" 
                                src="${(videoSrc) && String(videoSrc).startsWith('http') ? (videoSrc) : '/' + (videoSrc)}" 
                                loop playsinline 
                                ${index === 0 && isGlobalMuted ? 'muted' : ''} 
                                onclick="togglePlayPause(this)"
                                ondblclick="triggerDoubleTapLike(event, '${post._id}', this)"
                                ontimeupdate="updateScrubber(this)"
                                onpointerdown="startFastForward(this)"
                                onpointerup="stopFastForward(this)"
                                onpointerleave="stopFastForward(this)"
                                onpointercancel="stopFastForward(this)"
                                oncontextmenu="return false;"
                            ></video>
                            
                            
                            <!-- 2x Speed Indicator -->
                            <div class="ff-overlay"><i class="fas fa-forward"></i> 2x Speed</div>

                            <!-- Videlo Layout Overlay -->
                            <div class="reel-overlay videlo-layout">
                                <!-- Top Center Floating Title -->
                                <div class="videlo-top-title">
                                    ${post.content.substring(0, 15)}${post.content.length > 15 ? '...' : ''} | ${post.username}
                                </div>

                                <div class="videlo-bottom-block">
                                    <div class="videlo-info-actions">
                                        <!-- Bottom Left: Info -->
                                        <div class="videlo-info">
                                            <div class="videlo-author" style="display:flex; align-items:center;">
                                                <div class="videlo-avatar" onclick="window.location.href='/profile?user=${post.user ? post.user._id : ''}'">${authorAvatarHtml}</div>
                                                <div class="videlo-author-text">
                                                    <div style="display:flex; align-items:center; gap:8px;">
                                                        <strong onclick="window.location.href='/profile?user=${post.user ? post.user._id : ''}'" style="cursor:pointer; text-shadow:1px 1px 2px rgba(0,0,0,0.6);">${post.username}</strong>
                                                        <button class="ig-follow-btn" onclick="toggleFollow(event, '${post.user ? post.user._id : ''}', this)" style="background: transparent; border: 1px solid rgba(255,255,255,0.8); color: white; border-radius: 4px; padding: 2px 10px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background='transparent'">Follow</button>
                                                    </div>
                                                    <small onclick="window.location.href='/profile?user=${post.user ? post.user._id : ''}'" style="cursor:pointer; opacity:0.85; display:block; margin-top:2px;">@${post.username.toLowerCase()}</small>
                                                </div>
                                            </div>
                                            <div class="videlo-caption">${post.content}</div>
                                            <div class="videlo-audio"><i class="fas fa-music"></i> Original Audio - Explore...</div>
                                        </div>

                                        <!-- Bottom Right: 5 Action Circles -->
                                        <div class="videlo-actions">
                                            <button class="v-btn like-btn" onclick="toggleLike('${post._id}', this)">
                                                <i class="fa-heart ${isLiked ? 'fas liked' : 'fas'}"></i>
                                                <span class="v-label">${likeCount >= 1000 ? (likeCount/1000).toFixed(1)+'k' : likeCount}</span>
                                            </button>
                                            <button class="v-btn" onclick="openCommentDrawer('${post._id}')">
                                                <i class="fas fa-comment"></i>
                                                <span class="v-label">${commentCount}</span>
                                            </button>
                                            <button class="v-btn" onclick="shareReel('${post._id}')">
                                                <i class="fas fa-arrow-up-from-bracket"></i>
                                            </button>
                                            <button class="v-btn">
                                                <i class="fas fa-bookmark"></i>
                                            </button>
                                            ${isAuthor ? `
                                            <button class="v-btn" onclick="toggleContextMenu('${post._id}')">
                                                <i class="fas fa-ellipsis-h"></i>
                                            </button>
                                            <div class="context-menu" id="ctx-${post._id}">
                                                <button class="context-btn" onclick="openEditModal('${post._id}', \`${post.content.replace(/`/g, '\\`')}\`)"><i class="fas fa-pen"></i> Edit</button>
                                                <button class="context-btn danger" onclick="deleteReel('${post._id}')"><i class="fas fa-trash"></i> Delete</button>
                                            </div>
                                            ` : `
                                            <button class="v-btn">
                                                <i class="fas fa-ellipsis-h"></i>
                                            </button>
                                            `}
                                        </div>
                                    </div>

                                    <!-- Embedded Horizontal Scrubber At Bottom edge -->
                                    <div class="videlo-scrubber-row">
                                        <span class="vid-time current">0:00</span>
                                        <div class="videlo-scrubber-track" onclick="seekVideo(event, this)">
                                            <div class="videlo-scrubber-fill"></div>
                                        </div>
                                        <span class="vid-time total">0:15</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    feedContainer.insertAdjacentHTML('beforeend', reelHtml);
                });

                document.querySelectorAll('.reel-container').forEach(container => {
                    videoObserver.observe(container);
                });
            }

            loadReels();

            // Comment Send Binding
            document.getElementById('cmdSendBtn').addEventListener('click', postComment);
            document.getElementById('cmdInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') postComment(); });
        });

        // ==========================
        //  PLAYBACK & INTERACTIONS
        // ==========================
        function toggleGlobalMute() {
            isGlobalMuted = !isGlobalMuted;
            localStorage.setItem('vylithra_reels_muted', isGlobalMuted);
            const muteBtnI = document.querySelector('#globalMuteToggle i');
            muteBtnI.className = isGlobalMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
            if (currentPlayingVideo) {
                currentPlayingVideo.muted = isGlobalMuted;
            }
        }

        function togglePlayPause(videoElement) {
            if (videoElement.paused) {
                videoElement.play();
            } else {
                videoElement.pause();
            }
        }

        function updateScrubber(videoElement) {
            const container = videoElement.closest('.reel-container');
            const fill = container.querySelector('.scrubber-fill');
            if(fill && videoElement.duration) {
                const percentage = (videoElement.currentTime / videoElement.duration) * 100;
                fill.style.width = percentage + '%';
            }
        }

        function seekVideo(e, trackElement) {
            const container = trackElement.closest('.reel-container');
            const video = container.querySelector('video');
            if(!video.duration) return;
            const rect = trackElement.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            video.currentTime = percentage * video.duration;
        }

        function triggerDoubleTapLike(e, postId, videoElement) {
            e.preventDefault();
            const container = videoElement.closest('.reel-container');
            
            // Heart Animation Generation
            const heart = document.createElement('i');
            heart.className = 'fas fa-heart heart-float';
            heart.style.left = (e.clientX - 40) + 'px';
            heart.style.top = (e.clientY - 40) + 'px';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 800);

            // Trigger like logic if not already liked
            const btn = container.querySelector('.like-btn');
            const icon = btn.querySelector('i');
            if(!icon.classList.contains('fas')) {
                toggleLike(postId, btn);
            }
        }

        async function toggleLike(postId, btnElement) {
            const token = localStorage.getItem('token');
            if (!token) return alert('Please login to like reels!');

            const icon = btnElement.querySelector('i');
            const label = btnElement.querySelector('.action-label');
            const isCurrentlyLiked = icon.classList.contains('fas');

            if (isCurrentlyLiked) {
                icon.className = 'far fa-heart';
                label.innerText = parseInt(label.innerText) - 1;
            } else {
                icon.className = 'fas fa-heart liked';
                label.innerText = parseInt(label.innerText) + 1;
            }

            try {
                const res = await fetch(`${API_URL}/posts/${postId}/like`, {
                    method: 'PUT',
                    headers: { 'x-auth-token': token }
                });
                if (!res.ok) throw new Error('API Sync Fault');
                const data = await res.json();
                label.innerText = data.post.likes.length;
                if (data.post.likes.includes(currentUserId)) {
                    icon.className = 'fas fa-heart liked';
                } else {
                    icon.className = 'far fa-heart';
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function toggleFollow(e, targetUserId, badgeElement) {
            e.stopPropagation();
            const token = localStorage.getItem('token');
            if (!token) return alert('Please login to follow creators.');
            
            try {
                const res = await fetch(`${API_URL}/users/${targetUserId}/follow`, {
                    method: 'PUT',
                    headers: { 'x-auth-token': token }
                });
                if(res.ok) {
                    badgeElement.classList.add('following'); 
                }
            } catch (err) {
                console.error(err);
            }
        }

        function shareReel(postId) {
            const shareUrl = window.location.origin + '/reels?id=' + postId;
            if (navigator.share) {
                navigator.share({ title: 'Vylithra Reel', url: shareUrl }).catch(e => console.log(e));
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => alert('Reel link copied!'));
            }
        }

        // ==========================
        //  COMMENT ENGINE
        // ==========================
        function openCommentDrawer(postId) {
            activeCommentPostId = postId;
            document.getElementById('commentDrawer').classList.add('active');
            document.getElementById('commentFeed').innerHTML = `<div class="reels-loader" style="font-size:1rem;"><i class="fas fa-spinner fa-spin"></i> Load...</div>`;
            fetchComments(postId);
        }

        function closeCommentDrawer() {
            document.getElementById('commentDrawer').classList.remove('active');
            activeCommentPostId = null;
        }

        async function fetchComments(postId) {
            try {
                const res = await fetch(`${API_URL}/posts/${postId}`);
                if(res.ok) {
                    const post = await res.json();
                    renderComments(post.comments || []);
                }
            } catch (e) {
                document.getElementById('commentFeed').innerHTML = `<p style="color:red; text-align:center;">Failed to load.</p>`;
            }
        }

        function renderComments(comments) {
            const feed = document.getElementById('commentFeed');
            feed.innerHTML = '';
            if(!comments || comments.length === 0) {
                feed.innerHTML = `<p style="text-align:center; color:rgba(255,255,255,0.5); margin-top:30px;">Be the first to comment!</p>`;
                return;
            }
            comments.forEach(c => {
                let initial = (c.username || 'U').charAt(0).toUpperCase();
                let avatar = c.user && c.user.profilePicture ? `<img src="${(c.user.profilePicture) && String(c.user.profilePicture).startsWith('http') ? (c.user.profilePicture) : '/' + (c.user.profilePicture)}">` : `<span>${initial}</span>`;
                feed.innerHTML += `
                    <div class="c-item">
                        <div class="c-avatar">${avatar}</div>
                        <div>
                            <div class="c-user">@${c.username}</div>
                            <div class="c-content">${c.text}</div>
                        </div>
                    </div>
                `;
            });
            feed.scrollTop = feed.scrollHeight;
        }

        async function postComment() {
            const input = document.getElementById('cmdInput');
            const text = input.value.trim();
            const token = localStorage.getItem('token');
            if(!text || !activeCommentPostId || !token) return;

            input.value = '';
            // Optimistic render
            document.getElementById('commentFeed').innerHTML += `<div class="c-item" style="opacity:0.5;"><div class="c-avatar">...</div><div><div class="c-content">${text}</div></div></div>`;

            try {
                const res = await fetch(`${API_URL}/posts/${activeCommentPostId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
                    body: JSON.stringify({ text })
                });
                if(res.ok) {
                    const data = await res.json();
                    renderComments(data.post.comments);
                    
                    // Update Action Label internally
                    const container = document.querySelector(`.reel-container[data-id="${activeCommentPostId}"]`);
                    if(container) {
                        const lbl = container.querySelector('.fa-comment-dots').nextElementSibling;
                        lbl.innerText = data.post.comments.length;
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ==========================
        //  CREATOR STUDIO
        // ==========================
        function openStudioModal() {
            if(!localStorage.getItem('token')) return alert('You must be logged in to create Reels.');
            document.getElementById('studioModal').classList.add('active');
        }

        function closeStudioModal() {
            document.getElementById('studioModal').classList.remove('active');
            document.getElementById('reelUploadForm').reset();
        }

        async function submitReel(e) {
            e.preventDefault();
            const btn = document.getElementById('uploadConfigBtn');
            const token = localStorage.getItem('token');
            const file = document.getElementById('reelFile').files[0];
            const caption = document.getElementById('reelCaption').value;

            if(!file || !file.type.startsWith('video/')) return alert('Please select a valid video file.');

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;

            const formData = new FormData();
            formData.append('content', caption);
            formData.append('video', file);

            try {
                const res = await fetch(`${API_URL}/posts`, {
                    method: 'POST',
                    headers: { 'x-auth-token': token },
                    body: formData
                });
                if(res.ok) {
                    window.location.reload(); // Hard reload to refresh native intersection observers safely
                } else {
                    const data = await res.json();
                    alert(data.msg || 'Upload failed natively');
                }
            } catch (err) {
                console.error(err);
                alert('Server fault during packaging.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Publish Reel';
            }
        }

        // ==========================
        //  VIDELO SCRUBBER ENGINE
        // ==========================
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateScrubber(video) {
            const container = video.closest('.reel-container');
            if(!container) return;
            const fill = container.querySelector('.videlo-scrubber-fill');
            const currentLabel = container.querySelector('.vid-time.current');
            const totalLabel = container.querySelector('.vid-time.total');
            
            if(fill && video.duration) {
                const percentage = (video.currentTime / video.duration) * 100;
                fill.style.width = `${percentage}%`;
                
                if (currentLabel) currentLabel.innerText = formatTime(video.currentTime);
                if (totalLabel && totalLabel.innerText === "0:15" && video.duration > 1) {
                    totalLabel.innerText = formatTime(video.duration);
                }
            }
        }

        function seekVideo(event, track) {
            const container = track.closest('.reel-container');
            const video = container.querySelector('video');
            if(!video) return;
            
            const rect = track.getBoundingClientRect();
            const clickPos = (event.clientX - rect.left) / rect.width;
            
            video.currentTime = clickPos * video.duration;
            updateScrubber(video);
        }

        // ==========================
        //  EDIT / DELETE LOGIC
        // ==========================
        function toggleContextMenu(postId) {
            const menu = document.getElementById(`ctx-${postId}`);
            if(menu) menu.classList.toggle('active');
        }

        function openEditModal(postId, content) {
            document.getElementById(`ctx-${postId}`).classList.remove('active');
            document.getElementById('editPostId').value = postId;
            document.getElementById('editReelCaption').value = content;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function submitEditReel(e) {
            e.preventDefault();
            const btn = document.getElementById('editConfigBtn');
            const postId = document.getElementById('editPostId').value;
            const caption = document.getElementById('editReelCaption').value;
            const token = localStorage.getItem('token');

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving...`;

            try {
                const res = await fetch(`${API_URL}/posts/${postId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
                    body: JSON.stringify({ text: caption })  // Align with server.js property
                });
                
                if(res.ok) {
                    const container = document.querySelector(`.reel-container[data-id="${postId}"]`);
                    if(container) container.querySelector('.reel-caption').innerText = caption;
                    closeEditModal();
                } else {
                    const data = await res.json();
                    alert(data.msg || 'Edit failed');
                }
            } catch (err) {
                alert('Oops! Our servers took a quick nap. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Save Changes';
            }
        }

        async function deleteReel(postId) {
            document.getElementById(`ctx-${postId}`).classList.remove('active');
            if(!confirm("Are you sure you want to permanently delete this Reel?")) return;

            try {
                const res = await fetch(`${API_URL}/posts/${postId}`, {
                    method: 'DELETE',
                    headers: { 'x-auth-token': localStorage.getItem('token') }
                });
                if(res.ok) {
                    document.querySelector(`.reel-container[data-id="${postId}"]`).remove();
                } else {
                    alert('Failed to delete Reel.');
                }
            } catch (err) {
                alert('Server sync loss.');
            }
        }

        // Token Decoder
        function parseJwt(token) {
            try {
                if(!token) return null;
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(window.atob(base64)).user.id;
            } catch (e) {
                return null;
            }
        }

        // ==========================
        // IDEAL UX: NEXT-GEN FEATURES
        // ==========================


        // Feature 4: Global Ambilight Engine
        // Runs continuously reading active video and projecting it huge across the entire page body
        function startAmbilightEngine() {
            const canvas = document.getElementById('globalAmbientGlow');
            if(!canvas) return;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            const loop = () => {
                if (currentPlayingVideo && !currentPlayingVideo.paused && !currentPlayingVideo.ended) {
                    canvas.width = 32; 
                    canvas.height = 32;
                    try {
                        ctx.drawImage(currentPlayingVideo, 0, 0, 32, 32);
                    } catch(e) { /* CORS block gracefully avoided */ }
                }
                requestAnimationFrame(loop);
            };
            requestAnimationFrame(loop);
        }
        startAmbilightEngine();

        // Feature 5: Native Auto-Scroll Mechanism
        let isAutoScrollEnabled = false;
        function toggleAutoScroll() {
            isAutoScrollEnabled = !isAutoScrollEnabled;
            const btn = document.getElementById('autoScrollBtn');
            btn.classList.toggle('active', isAutoScrollEnabled);
        }

        // Global watcher for video ending to trigger Auto-Scroll
        document.getElementById('reels-feed').addEventListener('ended', (e) => {
            if (e.target.tagName === 'VIDEO' && isAutoScrollEnabled) {
                const currentContainer = e.target.closest('.reel-container');
                const nextContainer = currentContainer.nextElementSibling;
                if(nextContainer) nextContainer.scrollIntoView({ behavior: 'smooth' });
            }
        }, true); // Capture phase because 'ended' doesn't bubble naturally

        // Feature 6: Hold-to-Fast-Forward (TikTok interaction)
        let ffHoldTimer;
        function startFastForward(videoElement) {
            const container = videoElement.closest('.reel-container');
            const overlay = container.querySelector('.ff-overlay');
            ffHoldTimer = setTimeout(() => {
                videoElement.playbackRate = 2;
                if(overlay) overlay.classList.add('active');
            }, 350); // 350ms deep-press triggers 2x Speed
        }

        function stopFastForward(videoElement) {
            clearTimeout(ffHoldTimer);
            if(videoElement.playbackRate === 2) videoElement.playbackRate = 1;
            const container = videoElement.closest('.reel-container');
            if(container) {
                const overlay = container.querySelector('.ff-overlay');
                if(overlay) overlay.classList.remove('active');
            }
        }

        // Feature 7: Cinematic Parallax (Desktop Gyro Mock)
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            document.querySelectorAll('.reel-container').forEach(container => {
                const rect = container.getBoundingClientRect();
                if(rect.top < window.innerHeight && rect.bottom > 0) {
                    container.style.transform = `perspective(1000px) rotateX(${-y * 2}deg) rotateY(${x * 2}deg) scale3d(1.02, 1.02, 1.02)`;
                } else {
                    container.style.transform = 'none';
                }
            });
        });
    </script>
