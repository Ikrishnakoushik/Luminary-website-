<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- NO INDEX, NO FOLLOW TO KEEP SEARCH ENGINES OUT -->
    <meta name="robots" content="noindex, nofollow">
    <title>System Authentication</title>
    <!-- Use standard platform styles but no external dependencies if we can help it -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ui-common.css"> <!-- We can reuse standard variables -->

    <style>
        :root {
            /* Vylithra Global 3-Color Mint Theme */
            --bg-color: #f0fdfa;
            /* Base background */
            --surface: #ffffff;
            /* Card backgrounds */
            --primary: #14b8a6;
            /* Main accent (Buttons/Links) */

            /* Derived mapping for existing elements */
            --accent: var(--primary);
            --accent-hover: #0d9488;
            --text-main: #134e4a;
            --text-muted: #115e59;
            --border: #ccfbf1;
            --input-bg: var(--bg-color);
            --card-bg: var(--surface);
            --card-shadow: 0 4px 6px -1px rgba(20, 184, 166, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Hollow State Styling */
        #hollow-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Dashboard Styles - Injected Later */
        #admin-dashboard {
            display: none;
            /* Hidden by default */
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
            background: #f8fafc; /* Slightly darker body bg to contrast cards */
        }

        .admin-layout {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            flex-shrink: 0;
        }

        .sidebar-header {
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }
        
        .sidebar-header h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--text-main);
        }

        .sidebar-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0.25rem 0 0 0;
            word-break: break-all;
        }

        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .nav-tab {
            padding: 0.875rem 1rem;
            background: transparent;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            text-align: left;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
        }

        .nav-tab i {
            margin-right: 0.75rem;
            width: 20px;
            text-align: center;
            font-size: 1.1rem;
        }

        .nav-tab.active {
            background: var(--bg-color);
            color: var(--primary);
            font-weight: 600;
        }

        .nav-tab:hover:not(.active) {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .main-content {
            flex-grow: 1;
            padding: 2rem 3rem;
            overflow-y: auto;
        }

        .dashboard-content-area {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2.5rem;
            min-height: calc(100vh - 4rem);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-color);
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
        }

        .stat-card h3 {
            margin: 0 0 0.5rem 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        /* Data Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th,
        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 0.05em;
        }

        .data-table tbody tr:hover {
            background-color: var(--bg-color);
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.admin {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge.publisher {
            background: #e0e7ff;
            color: #3730a3;
        }

        .badge.reader {
            background: #f3f4f6;
            color: #374151;
        }

        .badge.published,
        .badge.completed {
            background: #d1fae5;
            color: #065f46;
        }

        .badge.draft,
        .badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .btn-action {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
            margin-right: 0.5rem;
        }

        .btn-update {
            background: var(--border);
            color: var(--text-main);
        }

        .btn-update:hover {
            background: #d1d5db;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .secret-setup {
            margin-top: 2rem;
            padding: 1rem;
            background: #fef2f2;
            border: 1px dashed #ef4444;
            border-radius: 0.5rem;
            display: none;
            /* Hidden unless explicitly needed by owner */
        }
    </style>
</head>

<body>

    <!-- 1. The Hollow State (Only thing visible in source code) -->
    <div id="hollow-state">
        <div class="spinner"></div>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Authenticating Secure Environment...</p>
    </div>

    <!-- 2. The Dashboard Container (Empty initially) -->
    <div id="admin-dashboard"></div>

    <script>
        // @ts-nocheck
        // STRICT SECURITY: Immediate execution to verify identity.
        // Do NOT put any sensitive HTML in the file itself.

        const token = localStorage.getItem('token');
        if (!token) {
            console.warn('No token found. Ejecting to main list.');
            window.location.replace('/main'); // Kick out
        } else {
            verifyAdmin();
        }


        async function verifyAdmin() {
            try {
                const response = await fetch('/api/admin/verify', {
                    headers: { 'x-auth-token': token, 'x-gateway-token': sessionStorage.getItem('gatewayToken') }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.title = 'Secure Gateway | Admin';
                    showGatewayChallenge(data.user);
                } else {
                    console.warn('Unauthorized. Ejecting.');
                    window.location.replace('/main');
                }
            } catch (error) {
                console.error('System error:', error);
                window.location.replace('/main');
            }
        }

        function showGatewayChallenge(user) {
            document.getElementById('hollow-state').style.display = 'none';
            const dashboard = document.getElementById('admin-dashboard');
            dashboard.style.display = 'flex';
            dashboard.style.alignItems = 'center';
            dashboard.style.justifyContent = 'center';
            dashboard.style.minHeight = '100vh';
            dashboard.style.background = 'var(--bg-light)';
            
            dashboard.innerHTML = `
                <div style = "background: white; padding: 3rem 2rem; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 100%;" >
                    <i class="fas fa-shield-alt" style="font-size: 3rem; color: var(--primary); margin-bottom: 1.5rem;"></i>
                    <h2 style="margin: 0 0 0.5rem 0;">Security Gateway</h2>
                    <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.875rem;" id="gateway-desc">Enter Master Credentials to unlock the Command Center.</p>
                    
                    <div id="step-1-inputs">
                        <div style="text-align: left; margin-bottom: 1rem;">
                            <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">Master Email</label>
                            <input type="email" id="gateway-email" placeholder="admin@example.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem; box-sizing: border-box;" />
                        </div>
                        
                        <div style="text-align: left; margin-bottom: 2rem;">
                            <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">Master Secret Key</label>
                            <input type="password" id="gateway-key" placeholder="••••••••••••••••" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem; box-sizing: border-box;" />
                        </div>
                        <button onclick="requestGatewayOTP('${user.username}')" style="width: 100%; padding: 0.875rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s;">
                            Verify Credentials <i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i>
                        </button>
                    </div>

                    <div id="step-2-inputs" style="display: none;">
                        <div style="text-align: left; margin-bottom: 2rem;">
                            <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">6-Digit Email OTP</label>
                            <input type="text" id="gateway-otp" placeholder="123456" maxlength="6" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1.25rem; letter-spacing: 0.5em; text-align: center; box-sizing: border-box;" />
                        </div>
                        <button onclick="verifyGatewayOTP('${user.username}')" style="width: 100%; padding: 0.875rem; background: var(--success); color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s;">
                            Unlock System <i class="fas fa-unlock" style="margin-left: 0.5rem;"></i>
                        </button>
                    </div>
                    
                    <p id="gateway-error" style="color: var(--danger); font-size: 0.875rem; margin-top: 1rem; display: none;">Invalid credentials.</p>
                    <p id="gateway-success" style="color: var(--success); font-size: 0.875rem; margin-top: 1rem; display: none;">OTP sent to email!</p>
                </div>
                `;
            
            // Allow pressing Enter on step 1
            document.getElementById('gateway-key').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') requestGatewayOTP(user.username);
            });
            // Allow pressing Enter on step 2
            document.getElementById('gateway-otp').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') verifyGatewayOTP(user.username);
            });
        }

        async function requestGatewayOTP(username) {
            const email = document.getElementById('gateway-email').value;
            const secretKey = document.getElementById('gateway-key').value;
            const errorMsg = document.getElementById('gateway-error');
            const successMsg = document.getElementById('gateway-success');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            try {
                const res = await fetch('/api/admin/gateway-request', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ email, secretKey })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('step-1-inputs').style.display = 'none';
                    document.getElementById('step-2-inputs').style.display = 'block';
                    document.getElementById('gateway-desc').innerText = 'Enter the 6-digit OTP sent to the Master Email.';
                    successMsg.innerText = data.msg;
                    successMsg.style.display = 'block';
                } else {
                    const data = await res.json();
                    errorMsg.innerText = data.msg || 'Invalid credentials.';
                    errorMsg.style.display = 'block';
                }
            } catch (e) {
                console.error(e);
                errorMsg.innerText = 'Network error contacting security terminal.';
                errorMsg.style.display = 'block';
            }
        }

        async function verifyGatewayOTP(username) {
            const otp = document.getElementById('gateway-otp').value;
            const errorMsg = document.getElementById('gateway-error');
            const successMsg = document.getElementById('gateway-success');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            try {
                const res = await fetch('/api/admin/gateway-verify', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ otp })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    sessionStorage.setItem('gatewayToken', data.token); // Store secure token
                    buildDashboardUI({ username }); // Proceed to dashboard
                } else {
                    const data = await res.json();
                    errorMsg.innerText = data.msg || 'Invalid OTP.';
                    errorMsg.style.display = 'block';
                }
            } catch (e) {
                console.error(e);
                errorMsg.innerText = 'Network error verifying OTP.';
                errorMsg.style.display = 'block';
            }
        }

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'x-auth-token': token,
                'x-gateway-token': sessionStorage.getItem('gatewayToken')
            };
        }

        function buildDashboardUI(user) {
            // Hide hollow state
            document.getElementById('hollow-state').style.display = 'none';

            // Inject the highly sensitive UI
            const dashboard = document.getElementById('admin-dashboard');
            dashboard.style.display = 'block';
            dashboard.innerHTML = `
                <div class="admin-layout">
                    <div class="sidebar">
                        <div class="sidebar-header">
                            <h1><i class="fas fa-shield-alt" style="color:var(--primary); margin-right:8px;"></i> Command Center</h1>
                            <p>${user.username}</p>
                        </div>
                        
                        <div class="admin-nav">
                            <button class="nav-tab active" onclick="switchTab('overview', this)"><i class="fas fa-chart-pie"></i> Overview</button>
                            <button class="nav-tab" onclick="switchTab('users', this)"><i class="fas fa-users"></i> Users</button>
                            <button class="nav-tab" onclick="switchTab('books', this)"><i class="fas fa-book"></i> Content</button>
                            <button class="nav-tab" onclick="switchTab('financials', this)"><i class="fas fa-money-bill-wave"></i> Financials</button>
                            <button class="nav-tab" onclick="switchTab('promos', this)"><i class="fas fa-ticket-alt"></i> Promo Codes</button>
                            <hr style="margin: 1rem 0; border: 0; border-top: 1px solid var(--border);">
                            <button class="nav-tab" onclick="switchTab('broadcast', this)"><i class="fas fa-bullhorn"></i> Broadcast</button>
                            <button class="nav-tab" onclick="switchTab('settings', this)"><i class="fas fa-cog"></i> Settings</button>
                        </div>

                        <div style="margin-top: auto; padding-top: 1rem;">
                            <button onclick="localStorage.removeItem('token'); window.location.href='/index';" class="nav-tab" style="width: 100%; color: var(--danger);"><i class="fas fa-sign-out-alt"></i> Terminate Session</button>
                        </div>
                    </div>

                    <div class="main-content">
                        <div class="dashboard-content-area" id="content-area">
                            <!-- Dynamic content loads here -->
                        </div>
                    </div>
                </div>
            `;

            // Load initial tab
            loadOverview();
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            
            const area = document.getElementById('content-area');
            area.innerHTML = '<div class="spinner" style="margin: 40px auto;"></div>';

            if (tab === 'overview') loadOverview();
            if (tab === 'users') loadUsers();
            if (tab === 'books') loadBooks();
            if (tab === 'financials') loadFinancials();
            if (tab === 'promos') loadPromoCodes();
            if (tab === 'broadcast') loadBroadcast();
            if (tab === 'settings') loadPlatformSettings();
        }

        // --- TAB LOADERS ---

        async function loadOverview() {
            try {
                const res = await fetch('/api/admin/stats', { headers: { 'x-auth-token': token, 'x-gateway-token': sessionStorage.getItem('gatewayToken') } });
                const stats = await res.json();
                
                document.getElementById('content-area').innerHTML = `
                <h2 style = "margin-top: 0;" > Platform Statistics</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Total Registered Users</h3>
                            <p class="value">${stats.totalUsers}</p>
                        </div>
                        <div class="stat-card">
                            <h3>Total Books Published</h3>
                            <p class="value">${stats.totalBooks}</p>
                        </div>
                        <div class="stat-card">
                            <h3>Total Publisher Earnings</h3>
                            <p class="value">₹${stats.totalRevenue.toLocaleString()}</p>
                        </div>
                    </div>
            `;
            } catch (err) {
                console.error(err);
                document.getElementById('content-area').innerHTML = '<p style="color:red">Failed to load statistics.</p>';
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users', { headers: { 'x-auth-token': token, 'x-gateway-token': sessionStorage.getItem('gatewayToken') } });
                const users = await res.json();
                
                let tbody = '';
                users.forEach(u => {
                    tbody += `
                <tr>
                            <td>
                                <div style="font-weight: 500;">${u.username}</div>
                                <div style="font-size: 0.875rem; color: var(--text-muted);">${u.email}</div>
                            </td>
                            <td><span class="badge ${u.role}">${u.role}</span></td>
                            <td>${new Date(u.loginHistory?.[u.loginHistory.length-1] || u.createdAt || Date.now()).toLocaleDateString()}</td>
                            <td>
                                <select onchange="updateUserRole('${u._id}', this.value)" style="padding: 0.25rem; border-radius: 0.25rem; border: 1px solid var(--border); margin-right: 0.5rem;">
                                    <option value="reader" ${u.role === 'reader' ? 'selected' : ''}>Reader</option>
                                    <option value="publisher" ${u.role === 'publisher' ? 'selected' : ''}>Publisher</option>
                                    <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                                </select>
                                <button class="btn-action btn-danger" onclick="deleteUser('${u._id}', '${u.username}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                `;
                });

                document.getElementById('content-area').innerHTML = `
                <h2 style = "margin-top: 0;" > User Management</h2>
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Role</th>
                                    <th>Last Login</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>${tbody}</tbody>
                        </table>
                    </div>
            `;
            } catch (err) {
                console.error(err);
            }
        }

        async function loadBooks() {
            try {
                const res = await fetch('/api/admin/books', { headers: { 'x-auth-token': token, 'x-gateway-token': sessionStorage.getItem('gatewayToken') } });
                const books = await res.json();
                
                let tbody = '';
                books.forEach(b => {
                    tbody += `
                <tr>
                            <td>
                                <div style="font-weight: 500;">${b.title}</div>
                                <div style="font-size: 0.875rem; color: var(--text-muted);">by ${b.author?.username || 'Unknown'}</div>
                            </td>
                            <td><span class="badge ${b.status}">${b.status}</span></td>
                            <td>₹${b.price}</td>
                            <td>
                                <button class="btn-action btn-update" onclick="toggleBookStatus('${b._id}', '${b.status === 'published' ? 'draft' : 'published'}')">
                                    ${b.status === 'published' ? 'Hide' : 'Publish'}
                                </button>
                                <button class="btn-action btn-danger" onclick="deleteBook('${b._id}', '${b.title.replace(/'/g, "'")}')"><i class="fas fa-trash"></i></button>
                            </td >
                        </tr>
                `;
                });

                document.getElementById('content-area').innerHTML = `
                <h2 style = "margin-top: 0;" > Content Moderation</h2>
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Book Context</th>
                                    <th>Status</th>
                                    <th>Price</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>${tbody}</tbody>
                        </table>
                    </div>
            `;
            } catch (err) {
                console.error(err);
            }
        }

        async function loadFinancials() {
            try {
                const res = await fetch('/api/admin/transactions', { headers: { 'x-auth-token': token, 'x-gateway-token': sessionStorage.getItem('gatewayToken') } });
                const txs = await res.json();
                
                let tbody = '';
                txs.forEach(t => {
                    tbody += `
                <tr>
                            <td>${new Date(t.date).toLocaleString()}</td>
                            <td>
                                <div style="font-weight: 500;">${t.username}</div>
                                <div style="font-size: 0.875rem; color: var(--text-muted);">${t.email}</div>
                            </td>
                            <td>WITHDRAWAL</td>
                            <td style="font-weight: 600;">₹${t.amount}</td>
                            <td><span class="badge ${t.status}">${t.status}</span></td>
                            <td><span style="font-size: 0.875rem; color: var(--text-muted);">${t.method} - ${t.details || ''}</span></td>
                            <td>
                                ${t.status === 'pending' ? `
                                    <button class="btn btn-primary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="processWithdrawal('${t.userId}', '${t.transactionId}', 'completed')">Approve</button>
                                    <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem; margin-top: 5px; background: rgba(239, 68, 68, 0.1); color: #ef4444;" onclick="processWithdrawal('${t.userId}', '${t.transactionId}', 'rejected')">Reject</button>
                                ` : '-'}
                            </td>
                        </tr>
                `;
                });

                if(txs.length === 0) {
                    tbody = '<tr><td colspan="7" style="text-align:center; padding: 2rem;">No withdrawal history found across platform.</td></tr>';
                }

                document.getElementById('content-area').innerHTML = `
                <h2 style = "margin-top: 0;" > Financial Ledger(Withdrawals)</h2>
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Publisher</th>
                                    <th>Type</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Payment Details</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>${tbody}</tbody>
                        </table>
                    </div>
            `;
            } catch (err) {
                console.error(err);
            }
        }

        async function loadPromoCodes() {
            try {
                const res = await fetch('/api/coupons/my-codes', { headers: { 'x-auth-token': token, 'x-gateway-token': sessionStorage.getItem('gatewayToken') } });
                const promos = await res.json();
                
                let tbody = '';
                promos.forEach(p => {
                    const generator = p.generatedBy ? `${ p.generatedBy.username } (${ p.generatedBy.email })` : 'Master Admin';
                    tbody += `
                <tr>
                            <td style="font-family: monospace; font-weight: bold; color: var(--primary);">${p.code}</td>
                            <td>${p.discountType === 'fixed' ? `$${p.discountAmount}` : `${p.discountPercentage}%`}</td>
                            <td>${p.usedCount} / ${p.maxUses}</td>
                            <td>${generator}</td>
                            <td><span class="badge ${p.status}">${p.status}</span></td>
                            <td>
                                ${p.status === 'pending' ? `
                                    <button class="btn btn-primary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="moderatePromo('${p._id}', 'active')">Approve</button>
                                    <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem; margin-top: 5px; background: rgba(239, 68, 68, 0.1); color: #ef4444;" onclick="moderatePromo('${p._id}', 'rejected')">Reject</button>
                                ` : `
                                    <button class="btn-action btn-update" onclick="openDispatchModal('${p._id}', '${p.code}', ${p.discountPercentage})" style="background: var(--primary); color: white;">
                                        <i class="fas fa-paper-plane" style="margin-right: 4px;"></i> Dispatch Email
                                    </button>
                                    <button class="btn-action btn-danger" onclick="deletePromo('${p._id}', '${p.code}')"><i class="fas fa-trash"></i></button>
                                `}
                            </td>
                        </tr>
                `;
                });

                if(promos.length === 0) {
                    tbody = '<tr><td colspan="6" style="text-align:center; padding: 2rem;">No pending or active promo codes.</td></tr>';
                }

                document.getElementById('content-area').innerHTML = `
                    <h2 style="margin-top: 0;">Promo Code Moderation & Dispatch</h2>
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 20px;">Review codes generated by publishers or bulk-email active discount codes to specific readers.</p>
                    
                    <div style="background: white; padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem; border: 1px solid var(--border);">
                        <h3 style="margin-top: 0; margin-bottom: 1rem;">Generate Master Code</h3>
                        <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                            <div style="flex: 1; min-width: 150px;">
                                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.5rem; font-weight: 500;">Type</label>
                                <select id="admin-promo-type" onchange="toggleAdminPromoType()" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem; box-sizing: border-box;">
                                    <option value="percentage">Percentage (%)</option>
                                    <option value="fixed">Fixed ($)</option>
                                </select>
                            </div>
                            <div style="flex: 1; min-width: 150px;">
                                <label id="admin-promo-val-label" style="display: block; font-size: 0.875rem; margin-bottom: 0.5rem; font-weight: 500;">Discount Percentage (%)</label>
                                <input type="number" id="admin-promo-discount" min="1" placeholder="e.g. 50" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem; box-sizing: border-box;" />
                            </div>
                            <div style="flex: 1; min-width: 150px;">
                                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.5rem; font-weight: 500;">Minimum Purchase ($)</label>
                                <input type="number" id="admin-promo-min-spend" min="0" value="0" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem; box-sizing: border-box;" />
                            </div>
                            <div style="flex: 1; min-width: 150px;">
                                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.5rem; font-weight: 500;">Max Uses</label>
                                <input type="number" id="admin-promo-uses" min="1" placeholder="e.g. 100" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem; box-sizing: border-box;" />
                            </div>
                            <div style="flex: 1; min-width: 150px;">
                                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.5rem; font-weight: 500;">Validity (Days)</label>
                                <input type="number" id="admin-promo-days" min="1" placeholder="e.g. 30" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem; box-sizing: border-box;" />
                            </div>
                            <div>
                                <button onclick="generateAdminPromo()" style="padding: 0.875rem 1.5rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; font-size: 1rem;"><i class="fas fa-plus" style="margin-right: 8px;"></i> Generate Active Code</button>
                            </div>
                        </div>
                    </div>

                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Discount</th>
                                    <th>Uses remaining</th>
                                    <th>Generated By</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>${tbody}</tbody>
                        </table>
                    </div>
                `;
            } catch (err) {
                console.error(err);
            }
        }

        async function moderatePromo(id, status) {
            if(!confirm(`Are you sure you want to mark this promo code as ${status}?`)) return;
            try {
                const res = await fetch(`/api/coupons/${id}/moderate`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ status })
                });
                if(res.ok) alert(`Promo code marked as ${status}.`);
                loadPromoCodes();
            } catch(e) { console.error(e); alert('Error moderating promo code.'); }
        }

        async function deletePromo(id, code) {
             if(!confirm(`WARNING: Permanent Deletion.nErase Active Promo Code: ${code}?`)) return;
             try {
                 const res = await fetch(`/api/coupons/${id}`, {
                     method: 'DELETE',
                     headers: getAuthHeaders()
                 });
                 if(res.ok) loadPromoCodes();
             } catch(e) { console.error(e); alert('Error deleting code.'); }
        }

        function openDispatchModal(id, code, percentage) {
            // Re-use content area for simple modal display (or create full overlay)
            const target = prompt(`Dispatch ${percentage}% Promo Code (${code}) via HTML Email.nnEnter target:n- 'all' (All Users)n- 'random' (100 Random Users)n- OR enter specific email addresses separated by commas:`);
            
            if(!target) return;
            
            if(confirm(`Are you sure you want to dispatch ${code} to ${target}?`)) {
                dispatchPromo(id, target);
            }
        }

        async function dispatchPromo(id, target) {
            document.getElementById('content-area').innerHTML = '<div class="spinner" style="margin: 40px auto;"></div><p style="text-align:center;">Dispatching HTML emails...</p>';
            try {
                const res = await fetch('/api/coupons/dispatch', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ couponId: id, targetCriteria: target })
                });
                
                const data = await res.json();
                if(res.ok) {
                    alert('SUCCESS: ' + data.msg);
                } else {
                    alert('FAILED: ' + data.msg);
                }
            } catch (err) {
                console.error(err);
                alert('Network error during dispatch.');
            }
            loadPromoCodes(); // Refresh view
        }

        function toggleAdminPromoType() {
            const type = document.getElementById('admin-promo-type').value;
            document.getElementById('admin-promo-val-label').innerText = type === 'percentage' ? 'Discount Percentage (%)' : 'Discount Amount ($)';
        }

        async function generateAdminPromo() {
            const type = document.getElementById('admin-promo-type').value;
            const discountVal = document.getElementById('admin-promo-discount').value;
            const minSpend = document.getElementById('admin-promo-min-spend').value;
            const uses = document.getElementById('admin-promo-uses').value;
            const days = document.getElementById('admin-promo-days').value;
            
            if(!discountVal || parseInt(discountVal) < 1) {
                alert('Please enter a valid discount value.');
                return;
            }
            if(type === 'percentage' && parseInt(discountVal) > 100) {
                alert('Percentage cannot exceed 100.');
                return;
            }
            if(!uses || uses < 1) {
                alert('Please enter a valid number of max uses.');
                return;
            }
            if(!days || days < 1) {
                alert('Please enter a valid number of validity days.');
                return;
            }

            const activeBtn = event.currentTarget || event.target;
            const originalText = activeBtn.innerHTML;
            activeBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Generating...';

            try {
                const res = await fetch('/api/coupons/generate', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ 
                        discountType: type,
                        discountPercentage: type === 'percentage' ? parseInt(discountVal) : undefined,
                        discountAmount: type === 'fixed' ? parseInt(discountVal) : undefined,
                        minPurchaseAmount: parseInt(minSpend),
                        maxUses: parseInt(uses),
                        validityDays: parseInt(days)
                    })
                });
                
                const data = await res.json();
                if(res.ok) {
                    alert('SUCCESS: ' + data.msg);
                    loadPromoCodes();
                } else {
                    alert('Error: ' + data.msg);
                    activeBtn.innerHTML = originalText;
                }
            } catch(e) {
                console.error(e);
                alert('Network error generating promo code.');
                activeBtn.innerHTML = originalText;
            }
        }

        async function updateUserRole(id, role) {
            if(!confirm(`Are you sure you want to change this user's role to ${role}?`)) {
                loadUsers(); // reset select
                return;
            }
            try {
                const res = await fetch(`/api/admin/users/${id}/role`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ role })
                });
                if(res.ok) alert('Role updated successfully.');
                loadUsers();
            } catch(e) { console.error(e); alert('Error updating role.'); }
        }

        async function deleteUser(id, name) {
            const code = prompt(`WARNING: Permanent Deletion.\nType "DELETE" to permanently erase user: ${name}`);
            if (code !== 'DELETE') return;

            try {
                const res = await fetch(`/api/admin/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-auth-token': token, 'x-gateway-token': sessionStorage.getItem('gatewayToken') }
                });
                if (res.ok) {
                    alert('User permanently deleted.');
                    loadUsers();
                }
            } catch (e) { console.error(e); alert('Error deleting user.'); }
        }

        async function toggleBookStatus(id, status) {
            try {
                const res = await fetch(`/api/admin/books/${id}/status`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ status })
                });
                if (res.ok) loadBooks();
            } catch (e) { console.error(e); alert('Error updating book status.'); }
        }

        async function deleteBook(id, title) {
            if (!confirm(`Are you sure you want to PERMANENTLY delete the book: "${title}"?`)) return;
            try {
                const res = await fetch(`/api/admin/books/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-auth-token': token, 'x-gateway-token': sessionStorage.getItem('gatewayToken') }
                });
                if (res.ok) loadBooks();
            } catch (e) { console.error(e); alert('Error deleting book.'); }
        }


        async function loadBroadcast() {
            document.getElementById('content-area').innerHTML = `
                <h2 style="margin-top: 0;">Global Broadcast</h2>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 2rem;">Send an email announcement to all registered users on the platform.</p>
                
                <div style="background: white; padding: 2rem; border-radius: 1rem; border: 1px solid var(--border); max-width: 800px;">
                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Subject Line</label>
                        <input type="text" id="broadcast-subject" placeholder="e.g. Major Platform Update!" style="width: 100%; padding: 0.875rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem; box-sizing: border-box;" />
                    </div>
                    
                    <div style="margin-bottom: 2rem;">
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Email Message (HTML Supported)</label>
                        <textarea id="broadcast-message" rows="10" placeholder="Hello everyone,<br><br>We are excited to announce..." style="width: 100%; padding: 0.875rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem; box-sizing: border-box; font-family: monospace; resize: vertical;"></textarea>
                    </div>

                    <button onclick="sendBroadcast()" id="broadcast-btn" style="padding: 1rem 2rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s;"><i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Dispatch Broadcast</button>
                </div>
            `;
        }

        async function sendBroadcast() {
            const subject = document.getElementById('broadcast-subject').value;
            const message = document.getElementById('broadcast-message').value;
            
            if(!subject || !message) {
                alert('Subject and Message are required.');
                return;
            }

            if(!confirm('Are you ABSOLUTELY sure you want to mass-email ALL users? This cannot be undone.')) return;

            const btn = document.getElementById('broadcast-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sending...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/broadcast', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ subject, message })
                });
                
                const data = await res.json();
                if(res.ok) {
                    alert('SUCCESS: ' + data.msg);
                    document.getElementById('broadcast-subject').value = '';
                    document.getElementById('broadcast-message').value = '';
                } else {
                    alert('Error: ' + data.msg);
                }
            } catch(e) {
                console.error(e);
                alert('Network error during broadcast dispatch.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function loadPlatformSettings() {
            document.getElementById('content-area').innerHTML = '<div class="spinner" style="margin: 40px auto;"></div>';
            
            try {
                const res = await fetch('/api/admin/settings', { headers: getAuthHeaders() });
                const settings = await res.json();
                
                document.getElementById('content-area').innerHTML = `
                    <h2 style="margin-top: 0;">Platform Settings</h2>
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 2rem;">Manage global application state and configuration.</p>
                    
                    <div style="background: white; padding: 2rem; border-radius: 1rem; border: 1px solid var(--border); max-width: 600px;">
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #f1f5f9;">
                            <div>
                                <h3 style="margin: 0 0 0.25rem 0; font-size: 1rem;">New Registrations</h3>
                                <p style="margin: 0; font-size: 0.875rem; color: var(--text-muted);">Allow new users to create accounts.</p>
                            </div>
                            <label style="position: relative; display: inline-block; width: 50px; height: 28px;">
                                <input type="checkbox" id="setting-registration" ${settings.registrationEnabled ? 'checked' : ''} style="opacity: 0; width: 0; height: 0;">
                                <span style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px;" class="slider"></span>
                            </label>
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #f1f5f9;">
                            <div>
                                <h3 style="margin: 0 0 0.25rem 0; font-size: 1rem; color: var(--danger);">Maintenance Mode</h3>
                                <p style="margin: 0; font-size: 0.875rem; color: var(--text-muted);">Displays a maintenance screen to all non-admin users.</p>
                            </div>
                            <label style="position: relative; display: inline-block; width: 50px; height: 28px;">
                                <input type="checkbox" id="setting-maintenance" ${settings.maintenanceMode ? 'checked' : ''} style="opacity: 0; width: 0; height: 0;">
                                <span style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px;" class="slider"></span>
                            </label>
                        </div>

                        <div style="margin-bottom: 2rem;">
                            <h3 style="margin: 0 0 0.5rem 0; font-size: 1rem;">Platform Fee (%)</h3>
                            <p style="margin: 0 0 1rem 0; font-size: 0.875rem; color: var(--text-muted);">The default revenue cut taken from publisher sales.</p>
                            <input type="number" id="setting-fee" value="${settings.platformFee}" min="0" max="100" style="width: 100px; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; font-size: 1rem;" />
                        </div>

                        <button onclick="savePlatformSettings()" id="settings-btn" style="padding: 1rem 2rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s;"><i class="fas fa-save" style="margin-right: 8px;"></i> Save Configuration</button>
                    </div>

                    <style>
                        /* Custom Toggle Switch CSS */
                        input:checked + .slider { background-color: var(--primary); }
                        input:focus + .slider { box-shadow: 0 0 1px var(--primary); }
                        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
                        input:checked + .slider:before { transform: translateX(22px); }
                    </style>
                `;
            } catch (e) {
                console.error(e);
                document.getElementById('content-area').innerHTML = '<p style="color:var(--danger)">Failed to load settings.</p>';
            }
        }

        async function savePlatformSettings() {
            const btn = document.getElementById('settings-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Saving...';
            btn.disabled = true;

            const payload = {
                registrationEnabled: document.getElementById('setting-registration').checked,
                maintenanceMode: document.getElementById('setting-maintenance').checked,
                platformFee: parseFloat(document.getElementById('setting-fee').value)
            };

            try {
                const res = await fetch('/api/admin/settings', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if(res.ok) {
                    alert('SUCCESS: ' + data.msg);
                } else {
                    alert('Error: ' + data.msg);
                }
            } catch(e) {
                console.error(e);
                alert('Network error saving settings.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

    </script>
</body>

</html>
