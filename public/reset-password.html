<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Vylithra | Join the Community</title>
    <meta name="description" content="Sign in to access your Creator Studio, curated collections, and the complete Vylithra ecosystem.">
    <meta name="keywords" content="Vylithra login, sign up, join creator community">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        if (localStorage.getItem('token')) {
            window.location.href = '/main';
        }
    </script>
    <style>
        :root {
            --bg-dark: #0f1115;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Gradient variables matching exactly the image */
            --glow-cyan: #007AFF;
            --glow-blue: #3b82f6;
            --glow-purple: #8b5cf6;
            
            --glass-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(0, 0, 0, 0.25));
            --glass-border: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ambient Background Glows */
        .bg-glows {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: var(--bg-dark);
            overflow: hidden;
        }
        
        .bg-mesh {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* Faint dotted grid pattern */
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .glow-cyan {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.45) 0%, transparent 60%);
            left: -15%;
            top: 10%;
            border-radius: 50%;
        }

        .glow-purple {
            position: absolute;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, transparent 60%);
            right: -20%;
            top: 5%;
            border-radius: 50%;
        }

        .glow-bottom {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.45) 0%, transparent 60%);
            left: 20%;
            bottom: -20%;
            border-radius: 50%;
        }

        /* Navigation */
        nav {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-gradient {
            background: linear-gradient(90deg, var(--glow-cyan), var(--glow-purple));
            color: white;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            box-shadow: 0 4px 25px rgba(59, 130, 246, 0.5);
            transform: translateY(-1px);
            color: white;
        }

        .btn-outline {
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-outline:hover {
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Hero Layout */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            padding: 5rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            align-items: center;
            flex-grow: 1;
        }

        .hero-left {
            max-width: 600px;
        }

        .hero-left h1 {
            font-size: 4.5rem;
            line-height: 1.1;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: white;
            letter-spacing: -1px;
        }

        .hero-left p {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            max-width: 500px;
        }

        .cta-group {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .hero-mockup-wrapper {
            position: relative;
            margin-top: 2rem;
        }

        .hero-mockup-wrapper img {
            max-width: 100%;
            border-radius: 12px;
            opacity: 0.8;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
        }

        /* Glassmorphic Auth Modal */
        .hero-right {
            display: flex;
            justify-content: flex-end;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Top highlight rim light */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        }

        .auth-card h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .auth-card > p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
            position: relative;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: color 0.3s;
        }

        .tab.active {
            color: white;
        }

        .tab-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            height: 2px;
            width: 50%;
            background: white;
            transition: transform 0.3s ease;
        }

        /* Forms */
        .form-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .form-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .input-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .input-group label a {
            color: var(--glow-cyan);
            text-decoration: none;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .input-field {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: white;
            border-radius: 8px;
            padding: 14px 16px 14px 44px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--glow-cyan);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.3);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .checkbox-group input { border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: transparent; cursor: pointer;
            accent-color: var(--glow-blue);
            width: 16px;
            height: 16px;
        }

        .checkbox-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--glow-cyan), var(--glow-purple));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 122, 255, 0.5);
        }

        .submit-btn:hover {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
            transform: translateY(-1px);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }

        .success-message {
            color: #10b981;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 2rem;
            }
            .hero-left {
                margin: 0 auto;
            }
            .hero-left h1 {
                font-size: 3.5rem;
            }
            .cta-group {
                justify-content: center;
            }
            .hero-mockup-wrapper {
                display: none; /* Hide on small screens to prioritize auth */
            }
            .nav-links {
                display: none; /* Mobile nav hiding */
            }
            .auth-card {
                margin: 0 auto;
            }
        }
        /* Social Auth */
        .social-auth {
            margin-top: 1.5rem;
        }
        .social-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
        }
        .social-divider::before, .social-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .social-divider::before { margin-right: 15px; }
        .social-divider::after { margin-left: 15px; }
        
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .btn-social {
            background: white;
            border: none;
            border-radius: 14px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }
        .btn-social.github { color: #24292e; font-size: 34px; }
        .btn-social.google img { width: 30px; height: auto; }
        .btn-social.microsoft img { width: 28px; height: auto; }
        .btn-social:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255,255,255,0.1);
        }

        .auth-footer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBMe2R5iWYj_H4IZ5OpkXSsyc9ULM5Esbw",
            authDomain: "luminary-eae16.firebaseapp.com",
            projectId: "luminary-eae16",
            storageBucket: "luminary-eae16.firebasestorage.app",
            messagingSenderId: "271803460699",
            appId: "1:271803460699:web:fcdd88f117dfe0817de37e",
            measurementId: "G-J0Z5FDTTK3"
        };
        
        // Ensure Firebase gets initialized only once
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        // Define providers globally so inline onclick handlers can use them
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        const githubProvider = new firebase.auth.GithubAuthProvider();
        // Option to add Microsoft provider if enabled later:
        // const microsoftProvider = new firebase.auth.OAuthProvider('microsoft.com');

        async function handleFirebaseSocialLogin(providerType) {
            let provider;
            if (providerType === 'google') provider = googleProvider;
            else if (providerType === 'github') provider = githubProvider;
            else {
                const errDiv = document.getElementById('loginError') || document.getElementById('regError');
                if(errDiv) errDiv.innerText = providerType + " login is not fully configured yet.";
                return;
            }

            try {
                // Use popup for maximum reliability cross-device/browser instead of redirects.
                const result = await firebase.auth().signInWithPopup(provider);
                if (result && result.user) {
                    const idToken = await result.user.getIdToken();
                    
                    // Exchange Firebase token for our robust hybrid session identity bridge
                    const res = await fetch('/api/auth/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ idToken, requestedRole: localStorage.getItem('signupRole') || 'reader' })
                    });
                    
                    const data = await res.json();
                    if (res.ok) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('username', data.username);
                        localStorage.setItem('role', data.role);
                        window.location.href = '/main';
                    } else {
                        const errDiv = document.getElementById('loginError') || document.getElementById('regError');
                        if(errDiv) errDiv.innerText = 'Login failed: ' + (data.msg || 'Unknown error');
                    }
                }
            } catch (error) {
                console.error("Firebase Auth Error:", error);
                const errDiv = document.getElementById('loginError') || document.getElementById('regError');
                if(errDiv) errDiv.innerText = 'Authentication failed: ' + error.message;
            }
        }
    </script>
</head>
<body>
    <header id="main-header" style="background: var(--bg-dark); padding: 20px 5%; border-bottom: 1px solid var(--input-border);">
        <a href="/" class="logo" style="text-decoration:none; color: white; font-weight:800; font-size:1.5rem;"><i class="fas fa-compass" style="color:var(--glow-cyan);"></i> Vylithra</a>
    </header>
    <main class="hero" style="grid-template-columns: 1fr; justify-content: center; align-items: center; min-height: 80vh; padding-top: 50px;">
        <div class="auth-card" style="margin: 0 auto; max-width: 450px; width: 100%;">
            <h2 style="font-size: 1.8rem; margin-bottom: 10px; color: var(--text-light); text-align: center;">Secure Reset</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 30px; font-size: 0.95rem;">Enter your new password below.</p>
            <form id="resetForm">
                <div class="input-group" style="display: none;">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="resetEmail" class="input-field" placeholder="Email Address" required>
                </div>
                <div class="input-group" style="display: none;">
                    <i class="fas fa-key"></i>
                    <input type="text" id="resetOtp" class="input-field" placeholder="6-Digit OTP" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPassword" class="input-field" placeholder="New Password" required minlength="6">
                </div>
                <button type="submit" class="submit-btn">Set New Password</button>
                <div class="error-message" id="resetError"></div>
                <div class="success-message" id="resetSuccess"></div>
            </form>
            <p class="auth-switch" style="text-align: center; margin-top: 20px;"><a href="/auth">Back to Sign In</a></p>
        </div>
    </main>
    <script>
        // Auto-fill hidden inputs from URL parameters sent by email
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        const otpParam = urlParams.get('otp');
        
        if(emailParam) document.getElementById('resetEmail').value = emailParam;
        if(otpParam) document.getElementById('resetOtp').value = otpParam;

        if(!emailParam || !otpParam) {
            document.getElementById('resetError').textContent = 'Invalid reset link. Missing parameters.';
            document.querySelector('.submit-btn').disabled = true;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const otp = document.getElementById('resetOtp').value;
            const newPassword = document.getElementById('newPassword').value;
            const errorMsg = document.getElementById('resetError');
            const successMsg = document.getElementById('resetSuccess');
            const btn = e.target.querySelector('button');
            
            errorMsg.textContent = '';
            successMsg.textContent = '';
            btn.textContent = 'Securing...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.msg || 'Failed to reset password');
                
                successMsg.textContent = 'Password successfully updated! Redirecting...';
                setTimeout(() => {
                    window.location.href = '/auth';
                }, 2000);
            } catch (err) {
                errorMsg.textContent = err.message;
                btn.textContent = 'Set New Password';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
