<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Lost in Cyberspace | Vylithra</title>
    <meta name="description" content="The page you are looking for does not exist or has been relocated within the Vylithra ecosystem.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #07090e;
            --surface: #0e121b;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #a855f7;
            --accent-magenta: #ec4899;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }
        .glow-orb-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, transparent 70%);
            top: 10%;
            left: 15%;
            filter: blur(40px);
            z-index: 0;
            animation: pulse 6s ease-in-out infinite alternate;
        }
        .glow-orb-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, transparent 70%);
            bottom: 10%;
            right: 15%;
            filter: blur(50px);
            z-index: 0;
            animation: pulse 8s ease-in-out infinite alternate-reverse;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }
        .card-404 {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            padding: 56px 48px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }
        .glitch-code {
            font-family: 'Outfit', sans-serif;
            font-size: 6.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 40%, #ec4899 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
        }
        .subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-light);
        }
        .description {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 36px;
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 24px;
        }
        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
            color: #07090e;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 242, 254, 0.45);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }
        .quick-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .quick-links a {
            color: var(--accent-cyan);
            text-decoration: none;
        }
        .quick-links a:hover {
            text-decoration: underline;
        }
        @media (max-width: 500px) {
            .card-404 { padding: 36px 24px; }
            .glitch-code { font-size: 5rem; }
            .action-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <div class="card-404">
        <div class="glitch-code">404</div>
        <h1 class="subtitle">Dimensional Rift Encountered</h1>
        <p class="description">The cosmic coordinates you requested do not point to an active nexus in the Vylithra galaxy. The link may be broken or the content has transitioned to a new dimension.</p>
        
        <div class="action-grid">
            <a href="/main" class="btn-action btn-primary">
                <i class="fa-solid fa-house"></i> Community Feed
            </a>
            <a href="javascript:history.back()" class="btn-action btn-secondary">
                <i class="fa-solid fa-arrow-left"></i> Turn Back
            </a>
        </div>

        <div class="quick-links">
            <span>Explore:</span>
            <a href="/books">Books & Publications</a>
            <a href="/reels">Reels</a>
            <a href="/creator-kit">Creator Kit</a>
        </div>
    </div>
</body>
</html>
